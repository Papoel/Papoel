name: Update README stats
on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Calculate age
        id: age
        run: |
          set -euo pipefail
          BIRTH_DATE="1985-02-20"
          TODAY=$(date -u +%Y-%m-%d)
          BIRTH_TS=$(date -u -d "$BIRTH_DATE" +%s)
          TODAY_TS=$(date -u -d "$TODAY" +%s)
          AGE=$(( (TODAY_TS - BIRTH_TS) / 31556952 ))
          echo "Calculated age: $AGE"
          echo "value=$AGE" >> "$GITHUB_OUTPUT"

      - name: Verify placeholder exists
        run: |
          set -euo pipefail
          if ! grep -q "<!--AGE-->" README.md; then
            echo "::error::Placeholder <!--AGE--> introuvable dans README.md"
            exit 1
          fi

      - name: Update README with age
        run: |
          set -euo pipefail
          sed -i -E "s|<!--AGE-->.*<!--/AGE-->|<!--AGE-->${{ steps.age.outputs.value }} ans<!--/AGE-->|" README.md

      - name: Generate stats image
        run: |
          mkdir -p charts
          if curl -sf "https://github-readme-stats.vercel.app/api?username=Papoel&show_icons=true&theme=dracula" -o charts/stats.svg; then
            echo "stats.svg generated"
          else
            echo "::warning::Service github-readme-stats indisponible, skip"
            rm -f charts/stats.svg
          fi

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          if [ -f charts/stats.svg ]; then
            git add charts/stats.svg
          fi
          git diff --staged --quiet || git commit -m "chore: update age and stats"
          git push
