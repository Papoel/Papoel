name: Waka Readme Stats

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

permissions:
  contents: write

concurrency:
  group: waka-readme-stats
  cancel-in-progress: true

jobs:
  update-waka-stats:
    name: Update README with WakaTime metrics
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update WakaTime stats in README
        uses: anmol098/waka-readme-stats@master
        with:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          SHOW_PROJECTS: "True"
          SHOW_COMMIT: "True"
          SYMBOL_VERSION: 3
          SHOW_PROFILE_VIEWS: "True"
          SHOW_LINES_OF_CODE: "True"
          SHOW_DAYS_OF_WEEK: "True"
          SHOW_SHORT_INFO: "True"
          SHOW_LOC_CHART: "False"
          SHOW_LANGUAGE_PER_REPO: "True"
          SHOW_UPDATED_DATE: "False"
          LOCALE: "fr"

  update-badge:
    name: Update last-updated badge
    needs: update-waka-stats
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Generate French timestamp
        id: date
        run: echo "now=$(TZ='Europe/Paris' date '+%d/%m/%Y %H:%M:%S')" >> "$GITHUB_OUTPUT"

      - name: Generate custom SVG badge
        run: |
          mkdir -p .github/assets
          cat > .github/assets/badge-updated.svg << 'EOF'
          <svg xmlns="http://www.w3.org/2000/svg" width="320" height="32" role="img" aria-label="Dernière mise à jour">
            <defs>
              <style>
                .badge-bg { fill: #0D262B; }
                .badge-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; font-size: 13px; font-weight: 500; fill: #0099A1; }
              </style>
            </defs>
            <rect class="badge-bg" width="320" height="32" rx="6"/>
            <text class="badge-text" x="160" y="22" text-anchor="middle">Dernière mise à jour : ${{ steps.date.outputs.now }}</text>
          </svg>
          EOF

      - name: Commit and push badge update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/assets/badge-updated.svg
          git diff --staged --quiet || git commit -m "chore: update last-updated badge [skip ci]"
          git push
