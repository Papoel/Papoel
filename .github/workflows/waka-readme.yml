name: Waka Readme Stats

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

permissions:
  contents: write

concurrency:
  group: waka-readme-stats
  cancel-in-progress: true

jobs:
  update-waka-stats:
    name: Update README with WakaTime metrics
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update WakaTime stats in README
        uses: anmol098/waka-readme-stats@master
        with:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          SHOW_PROJECTS: "True"
          SHOW_COMMIT: "True"
          SYMBOL_VERSION: 3
          SHOW_PROFILE_VIEWS: "True"
          SHOW_LINES_OF_CODE: "True"
          SHOW_DAYS_OF_WEEK: "True"
          SHOW_SHORT_INFO: "True"
          SHOW_LOC_CHART: "False"
          SHOW_LANGUAGE_PER_REPO: "True"
          SHOW_UPDATED_DATE: "False"
          LOCALE: "fr"

  update-badge:
    name: Update last-updated badge
    needs: update-waka-stats
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Generate French timestamp
        id: date
        run: echo "now=$(TZ='Europe/Paris' date '+%d/%m/%Y %H:%M:%S')" >> "$GITHUB_OUTPUT"

      - name: Update badge in README
        run: |
          BADGE_URL="https://img.shields.io/badge/Derni%C3%A8re%20mise%20à%20jour%20le-${{ steps.date.outputs.now }}-blue?style=flat-square"
          ENCODED_URL=$(echo "$BADGE_URL" | sed 's/ /%20/g')
          sed -i -E "s#!\[Last Updated\]\(https://img.shields.io/badge/[^)]*\)#![Last Updated](${ENCODED_URL})#" README.md

      - name: Commit and push badge update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --staged --quiet || git commit -m "chore: update last-updated badge [skip ci]"
          git push
